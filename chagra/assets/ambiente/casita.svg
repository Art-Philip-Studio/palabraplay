<svg xmlns="http://www.w3.org/2000/svg" width="280" height="320" viewBox="0 0 280 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
