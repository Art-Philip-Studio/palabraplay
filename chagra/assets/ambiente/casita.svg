  <rect x="158" y="232" width="68" height="54" rx="5" fill="#F2E6C9"/>
  <rect x="163" y="237" width="58" height="44" rx="3" fill="#3E6FA3"/>
  <rect x="189" y="237" width="4" height="44" fill="#F2E6C9"/>
  <rect x="163" y="257" width="58" height="4" fill="#F2E6C9"/>
  <rect x="150" y="288" width="84" height="7" rx="3" fill="#8A5A3C"/>

  <!-- Techo de teja a dos aguas con alero -->
  <use href="#techo" fill="#B23A48"/>
  <g clip-path="url(#ctecho)">
    <rect x="0" y="92" width="280" height="9" fill="#8A5A3C" fill-opacity="0.32"/>
