  <ellipse cx="206" cy="304" rx="22" ry="7" fill="#8A5A3C" fill-opacity="0.1"/>

  <!-- Sombra suave bajo el alero -->
  <rect x="32" y="190" width="216" height="8" fill="#2B2B2B" fill-opacity="0.12"/>

  <!-- Franja de textil andino bajo el alero -->
  <rect x="32" y="199" width="216" height="18" rx="3" fill="#B23A48"/>
  <rect x="32" y="201" width="216" height="2" fill="#F2E6C9"/>
  <rect x="32" y="213" width="216" height="2" fill="#F2E6C9"/>
  <use href="#rombo" transform="translate(44 208)"/>
