  <use href="#rombo" transform="translate(92 208)"/>
  <use href="#rombo" transform="translate(116 208)"/>
  <use href="#rombo" transform="translate(140 208)"/>
  <use href="#rombo" transform="translate(164 208)"/>
  <use href="#rombo" transform="translate(188 208)"/>
  <use href="#rombo" transform="translate(212 208)"/>
  <use href="#rombo" transform="translate(236 208)"/>

  <!-- Puerta de madera con arco suave -->
  <path d="M60,320 L60,246 Q60,222 84,222 L100,222 Q124,222 124,246 L124,320 Z" fill="#2B2B2B" fill-opacity="0.22"/>
  <path d="M64,320 L64,248 Q64,226 84,226 L100,226 Q120,226 120,248 L120,320 Z" fill="#8A5A3C"/>
  <path d="M71,320 L71,252 Q71,234 86,234 L98,234 Q113,234 113,252 L113,320 Z" fill="#2B2B2B" fill-opacity="0.14"/>
  <circle cx="108" cy="278" r="3.5" fill="#C9B458"/>

