<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Franja de pasto: borde de arriba en verde oscuro, pasto liso en y=16-40, transición suave a tierra -->
    <linearGradient id="gtop" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="78">
      <stop offset="0" stop-color="#2F4B3A"/>
      <stop offset="0.2" stop-color="#6B8F4E"/>
      <stop offset="0.52" stop-color="#6B8F4E"/>
      <stop offset="1" stop-color="#8A5A3C"/>
    </linearGradient>
    <!-- Lomo claro y surco oscuro, con bordes que se desvanecen -->
    <linearGradient id="glight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E6C9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2E6C9" stop-opacity="1"/>
      <stop offset="1" stop-color="#F2E6C9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gdark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B2B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2B2B2B" stop-opacity="1"/>
      <stop offset="1" stop-color="#2B2B2B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tierra base -->
  <rect width="1080" height="520" fill="#8A5A3C"/>

  <!-- Pasto arriba y transición a tierra -->
  <rect width="1080" height="80" fill="url(#gtop)"/>

  <!-- Surcos: 6 bandas suaves, cada vez más altas hacia abajo -->
  <rect y="70"  width="1080" height="45" fill="url(#glight)" fill-opacity="0.07"/>
  <rect y="115" width="1080" height="50" fill="url(#gdark)"  fill-opacity="0.08"/>
  <rect y="165" width="1080" height="55" fill="url(#glight)" fill-opacity="0.08"/>
  <rect y="220" width="1080" height="60" fill="url(#gdark)"  fill-opacity="0.09"/>
  <rect y="280" width="1080" height="60" fill="url(#glight)" fill-opacity="0.07"/>
  <rect y="340" width="1080" height="40" fill="url(#gdark)"  fill-opacity="0.05"/>
</svg>
