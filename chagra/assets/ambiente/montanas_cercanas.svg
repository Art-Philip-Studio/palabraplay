<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Loma de atrás -->
    <path id="back" d="M0,290 C40,260 70,200 140,200 C210,200 265,310 300,310 C335,310 380,165 450,165 C520,165 565,320 600,320 C635,320 650,215 720,215 C780,215 790,330 820,330 C850,330 870,190 940,190 C1010,190 1050,260 1080,290 L1080,510 L0,510 Z"/>
    <!-- Loma de adelante -->
    <path id="front" d="M0,340 C30,320 50,270 110,270 C175,270 215,345 250,345 C285,345 330,245 400,245 C470,245 505,345 540,345 C575,345 590,265 650,265 C710,265 785,350 820,350 C855,350 880,255 950,255 C1010,255 1050,300 1080,340 L1080,510 L0,510 Z"/>

    <!-- Velo morado de la loma de atrás: fuerte arriba, suave abajo -->
    <linearGradient id="gveil" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="350">
      <stop offset="0" stop-color="#5E5A7A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5E5A7A" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Luz en la parte alta de las laderas -->
    <linearGradient id="glightB" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="270">
      <stop offset="0" stop-color="#6B8F4E" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6B8F4E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glightF" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="315">
      <stop offset="0" stop-color="#6B8F4E" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6B8F4E" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cback"><use href="#back"/></clipPath>
    <clipPath id="cfront"><use href="#front"/></clipPath>
  </defs>

  <!-- Loma de atrás: verde oscuro con velo morado -->
  <use href="#back" fill="#2F4B3A"/>
  <use href="#back" fill="url(#gveil)"/>
  <rect x="0" y="150" width="1080" height="130" fill="url(#glightB)" clip-path="url(#cback)"/>
  <g clip-path="url(#cback)">
    <!-- Chacras en la ladera alta del pico central -->
    <path d="M478,210 q20,-12 44,-4 q10,14 -2,28 q-24,8 -44,-2 z" fill="#C9B458" fill-opacity="0.6"/>
    <path d="M512,242 q18,-8 36,-2 q8,12 -2,24 q-20,6 -36,-2 z" fill="#8A5A3C" fill-opacity="0.55"/>
  </g>

  <!-- Loma de adelante: verde oscuro, masa tranquila hacia abajo -->
  <use href="#front" fill="#2F4B3A"/>
  <rect x="0" y="235" width="1080" height="90" fill="url(#glightF)" clip-path="url(#cfront)"/>
  <g clip-path="url(#cfront)">
    <!-- Chacra en la ladera alta de la derecha -->
    <path d="M985,278 q18,-9 38,-3 q8,12 -2,23 q-20,7 -36,-1 z" fill="#C9B458" fill-opacity="0.55"/>
  </g>
</svg>
