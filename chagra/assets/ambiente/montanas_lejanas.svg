<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Capa más lejana -->
    <path id="back" d="M0,320 C40,280 80,150 150,150 C220,150 265,250 300,250 C335,250 370,70 440,70 C510,70 575,240 610,240 C645,240 670,140 720,140 C770,140 790,300 820,300 C850,300 880,150 930,150 C1000,150 1050,290 1080,320 L1080,610 L0,610 Z"/>
    <!-- Capa intermedia -->
    <path id="mid" d="M0,380 C40,350 80,230 160,230 C230,230 225,320 260,320 C295,320 340,205 410,205 C480,205 525,330 560,330 C595,330 610,215 680,215 C740,215 785,308 820,308 C855,308 880,230 950,230 C1020,230 1040,340 1080,380 L1080,610 L0,610 Z"/>
    <!-- Capa menos lejana -->
    <path id="front" d="M0,450 C40,400 70,310 150,310 C220,310 255,400 290,400 C325,400 370,320 440,320 C510,320 565,410 600,410 C635,410 660,330 730,330 C780,330 795,345 820,345 C850,345 870,320 930,320 C1000,320 1040,410 1080,450 L1080,610 L0,610 Z"/>

    <linearGradient id="gmid" gradientUnits="userSpaceOnUse" x1="0" y1="190" x2="0" y2="560">
      <stop offset="0" stop-color="#3E6FA3"/>
      <stop offset="1" stop-color="#5E5A7A"/>
    </linearGradient>

    <linearGradient id="gmist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E6C9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2E6C9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2E6C9" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cback"><use href="#back"/></clipPath>
    <clipPath id="cmid"><use href="#mid"/></clipPath>
  </defs>

  <!-- 1. Cordillera más lejana: azul aclarado con un velo crema -->
  <use href="#back" fill="#3E6FA3"/>
  <use href="#back" fill="#F2E6C9" fill-opacity="0.22"/>

  <!-- Neblina entre la capa lejana y la intermedia -->
  <rect x="0" y="285" width="1080" height="110" fill="url(#gmist)" clip-path="url(#cback)"/>

  <!-- 2. Cordillera intermedia: de azul a morado -->
  <use href="#mid" fill="url(#gmid)"/>

  <!-- Neblina entre la capa intermedia y la cercana -->
  <rect x="0" y="360" width="1080" height="120" fill="url(#gmist)" fill-opacity="0.8" clip-path="url(#cmid)"/>

  <!-- 3. Cordillera menos lejana: morado más fuerte -->
  <use href="#front" fill="#5E5A7A"/>
</svg>
