<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Mi Chagra</title>
<style>
  :root {
    --verde-oscuro:#2F4B3A; --verde-pasto:#6B8F4E; --maiz:#C9B458; --tierra:#8A5A3C;
    --naranja:#D9822B; --rojo:#B23A48; --azul:#3E6FA3; --crema:#F2E6C9;
    --morado:#5E5A7A; --negro:#2B2B2B;
    --ground: 1400px;            /* LINEA DEL SUELO */
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:var(--negro); overflow:hidden; font-family:sans-serif; }

  /* La escena mide siempre 1080x1920 y se escala para caber en la pantalla */
  #viewport { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #ventana { position:relative; overflow:hidden; flex:none; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; transform-origin:0 0; overflow:hidden; background:var(--azul); flex:none; }

  .capa { position:absolute; left:0; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  .capa img { display:block; }

  /* Todo lo que se para en el suelo: su base queda en la línea --ground */
  .en-suelo { position:absolute; bottom:calc(var(--alto, 1920px) - var(--ground)); }
  .en-suelo img { display:block; -webkit-user-drag:none; user-select:none; }

  #cielo        { top:0; }
  #lejanas      { top:calc(var(--ground) - 600px); }
  #cercanas     { top:calc(var(--ground) - 500px + 40px); }
  #suelo        { top:var(--ground); }
  #relleno      { top:1800px; width:1080px; height:3200px; background:var(--tierra); }  /* continúa la tierra bajo suelo.svg; va detrás y se solapa para que no se vea costura */

  #casita  { left:20px; }
  #abuela  { left:320px; transition:transform .15s; }
  #imgAbuela { transform-origin:50% 100%; animation:respira 3.2s ease-in-out infinite; }
  @keyframes respira { 50% { transform:scaleY(1.014); } }
  #abuela.salto { transform:translateY(-24px); }
  .planta  { cursor:pointer; z-index:2; transform:scale(1.4); transform-origin:50% 100%; }
  .planta::before { content:""; position:absolute; inset:-14px -16px 0 -16px; }          /* área de toque más grande */
  .planta.atras { z-index:1; transform:scale(1.19); bottom:calc(var(--alto, 1920px) - var(--ground) + 60px); }
  .planta.bloqueada img { filter:grayscale(1) brightness(.8); opacity:.28; }
  .planta:active img { transform:scale(.96); }
  .planta.lista img { animation:brillo 1s infinite alternate; }
  @keyframes brillo { to { filter:drop-shadow(0 0 22px #F2E6C9) brightness(1.08); } }
  .barra { position:absolute; top:calc(var(--ground) + 22px); width:110px; height:14px; background:rgba(43,43,43,.45); border-radius:8px; overflow:hidden; }
  .barra i { display:block; height:100%; width:0; background:var(--maiz); }
  button:disabled { opacity:.55; }

  /* Cambio de luz */
  #tinte { position:absolute; inset:0; background:var(--naranja); opacity:0; mix-blend-mode:multiply; pointer-events:none; transition:opacity .8s; }
  #stage.atardecer #tinte { opacity:.25; }

  /* Interfaz */
  #hud { position:absolute; top:calc(40px + var(--crop, 0px)); left:40px; right:40px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
  #msg { white-space:normal; max-width:620px; min-width:0; font-size:30px; line-height:1.2; padding:10px 24px; border-radius:34px; text-align:center; opacity:0; transition:opacity .5s; }
  #msg.ver { opacity:1; }
  #hud { gap:20px; }
  .pill { white-space:nowrap; background:rgba(43,43,43,.6); color:var(--crema); font-size:34px; padding:10px 24px; border-radius:60px; }
  /* Panel de mejoras: vive abajo, en la tierra, fuera del campo de juego */
  #panel { position:absolute; left:0; right:0; bottom:0; z-index:8; padding:28px 40px 56px; display:flex; flex-direction:column; gap:12px;
           background:rgba(43,43,43,.92); border-radius:56px 56px 0 0; }
  #panelTop { display:flex; justify-content:space-between; align-items:center; color:var(--crema); font-size:40px; font-weight:bold; }
  #btnLuz { font-size:34px; padding:10px 26px; border-radius:40px; }
  .mejora { display:flex; align-items:center; gap:24px; width:100%; height:116px; padding:0 28px; border-radius:32px; text-align:left; }
  .mejora .ico { font-size:60px; }
  .mejora .txt { flex:1; display:flex; flex-direction:column; gap:4px; }
  .mejora .t { font-size:40px; }
  .mejora .d { font-size:28px; font-weight:normal; opacity:.75; }
  .mejora .precio { font-size:40px; padding:12px 26px; border-radius:40px; background:var(--verde-oscuro); color:var(--crema); white-space:nowrap; }
  .cuy { bottom:calc(var(--alto, 1920px) - var(--ground) - 16px); z-index:5; --e:1.6; --b:1; --fy:1; transform:scale(calc(var(--e) * var(--b)), calc(var(--e) * var(--b) * var(--fy))); transform-origin:50% 100%; }
  .cuy img { display:block; }
  .mas { position:absolute; font-size:56px; font-weight:bold; color:var(--crema); text-shadow:0 3px 0 var(--negro); animation:sube .9s forwards; pointer-events:none; z-index:9; }
  @keyframes sube { to { transform:translateY(-110px); opacity:0; } }
  button { font-family:inherit; font-size:30px; padding:20px 26px; border:0; border-radius:20px; background:var(--crema); color:var(--negro); font-weight:bold; }
  /* Pantalla horizontal: el panel sale de la escena y se pone al lado, con tamaños normales */
  body.horizontal #panel { position:relative; left:auto; right:auto; bottom:auto; width:380px; margin-left:24px; flex:none; border-radius:28px; padding:18px; gap:10px; }
  body.horizontal #panelTop { font-size:20px; flex-wrap:wrap; gap:8px; }
  body.horizontal .botonesTop { flex-wrap:wrap; align-items:center; }
  body.horizontal #btnLuz { font-size:18px; padding:6px 14px; }
  body.horizontal .mejora { height:72px; padding:0 14px; gap:12px; border-radius:18px; }
  body.horizontal .mejora .ico { font-size:32px; }
  body.horizontal .mejora .t { font-size:18px; }
  body.horizontal .mejora .d { font-size:13px; }
  body.horizontal .mejora .precio { font-size:18px; padding:6px 14px; }
  .botonesTop { display:flex; gap:10px; }
  .mini { font-size:34px; padding:10px 22px; border-radius:40px; }
  .fila { display:flex; align-items:center; gap:12px; color:var(--crema); font-size:32px; flex-wrap:wrap; }
  .fila .info { flex:1; min-width:100%; font-size:28px; opacity:.8; }
  .chip { font-size:44px; padding:6px 20px; border-radius:30px; }
  .chip.sel { background:var(--maiz); }
  .chip:disabled { opacity:.3; }
  #btnSiembra { display:none; background:var(--maiz); }
  #cap { position:absolute; top:calc(160px + var(--crop, 0px)); left:40px; right:40px; font-size:34px; color:var(--crema); text-shadow:0 2px 0 var(--negro); pointer-events:none; }
  #cap span { display:inline-block; background:rgba(43,43,43,.45); padding:3px 16px; border-radius:26px; text-shadow:none; font-size:24px; pointer-events:auto; cursor:pointer; }
  #dialogo { position:absolute; left:230px; top:655px; width:640px; padding:18px 28px; background:var(--crema); color:var(--negro); font-size:34px; font-weight:bold; border-radius:36px; z-index:7; pointer-events:none; opacity:0; transition:opacity .4s; }
  #dialogo.ver { opacity:1; }
  #dialogo::after { content:""; position:absolute; left:var(--cola, 120px); bottom:-26px; border:26px solid transparent; border-top-color:var(--crema); border-bottom:0; }
  #yapa { position:absolute; width:150px; height:150px; font-size:120px; line-height:150px; text-align:center; z-index:6; cursor:pointer; animation:flota 1s ease-in-out infinite alternate; filter:drop-shadow(0 0 24px #F2E6C9); }
  @keyframes flota { to { transform:translateY(-26px) scale(1.12); } }
  body.horizontal #panel { max-height:96vh; overflow-y:auto; }
  body.horizontal .mini { font-size:16px; padding:5px 12px; }
  body.horizontal .fila { font-size:15px; }
  body.horizontal .fila .info { font-size:13px; }
  body.horizontal .chip { font-size:24px; padding:4px 12px; }
  button:active { background:var(--maiz); }
  /* Caminar y la casa por dentro */
  #stage { touch-action:none; }
  #hud, #cap { z-index:7; }
  #imgAbuela.camina { animation:paso .38s ease-in-out infinite; }
  @keyframes paso { 0%,100% { transform:translateY(0) rotate(-2deg); } 50% { transform:translateY(-12px) rotate(2deg); } }
  #fade { position:absolute; inset:0; background:var(--negro); opacity:0; pointer-events:none; transition:opacity .35s; z-index:6; }
  #interior { position:absolute; left:0; top:0; width:1080px; height:100%; z-index:3; display:none; overflow:hidden; background:#8D5F41; }
  #intFondo { position:absolute; left:0; top:0; display:block; }
  #puerta { left:0; }
  .saco { z-index:2; }
  .saco.atras { z-index:1; bottom:calc(var(--alto, 1920px) - var(--ground) + 85px); transform:scale(.82); transform-origin:50% 100%; }
  #stage.dentro #interior { display:block; }
  #stage.dentro #abuela { z-index:4; }
  #stage.dentro .planta, #stage.dentro .barra, #stage.dentro .cuy, #stage.dentro #yapa, #stage.dentro #casita, #stage.dentro #burro { display:none; }
  /* El burrito espera junto a la casita; brilla cuando hay sacos llenos para llevar al mercado */
  #abuela { pointer-events:none; }   /* para poder tocar el burrito aunque ella esté delante */
  #burro { left:280px; cursor:pointer; }
  #burro img { width:302px; display:block; }
  #burro::before { content:""; position:absolute; inset:-20px; }
  #burro.listo img { animation:brillo 1s infinite alternate; }
  /* El viaje al mercado: camino y plaza */
  #viaje { position:absolute; left:0; top:0; width:1080px; height:100%; z-index:3; display:none; overflow:hidden; background:#84573B; }
  #viajeFondo { position:absolute; left:0; top:0; display:block; }
  #burroViaje { left:-450px; }
  #burroViaje img { display:block; }
  #imgBurroViaje.camina { animation:paso .5s ease-in-out infinite; }
  #stage.viaje #viaje { display:block; }
  #stage.viaje .planta, #stage.viaje .barra, #stage.viaje .cuy, #stage.viaje #yapa, #stage.viaje #casita, #stage.viaje #abuela, #stage.viaje #burro { display:none; }
  /* La granja de cuyes: se abre con el botón 🐹 o tocando un cuy */
  #granja { position:absolute; left:0; top:0; width:1080px; height:100%; z-index:3; display:none; overflow:hidden; background:#8D5F41; }
  #granjaFondo { position:absolute; left:0; top:0; display:block; }
  #stage.granja #granja { display:block; }
  #stage.granja #dialogo { display:none; }
  #stage.granja .planta, #stage.granja .barra, #stage.granja .cuy, #stage.granja #yapa, #stage.granja #casita, #stage.granja #abuela, #stage.granja #burro { display:none; }
  #granjaBotones { position:absolute; left:40px; right:40px; top:calc(var(--crop, 0px) + 250px); display:flex; gap:16px; z-index:2; }
  #granjaBotones button { font-size:38px; padding:18px 28px; border-radius:40px; }
  #granjaBotones #btnTodos { flex:1; }
  #granjaVacia { position:absolute; left:80px; right:80px; top:1000px; text-align:center; font-size:44px; color:var(--crema); background:rgba(43,43,43,.7); padding:24px; border-radius:30px; display:none; }
  .cuyG { cursor:pointer; z-index:2; --e:2; --b:1; --fy:1; transform:scale(calc(var(--e) * var(--b)), calc(var(--e) * var(--b) * var(--fy))); transform-origin:50% 100%; width:120px; }
  .cuyG.atras { z-index:1; }
  /* con más de 4 cuyes la granja usa dos filas: los de adelante se achican un poco y los de atrás quedan más arriba */
  #granja.dosFilas .cuyG { --e:1.7; }
  #granja.dosFilas .cuyG.atras { --e:1.35; bottom:calc(var(--alto, 1920px) - var(--ground) + 104px); }
  .cuyG .hb { position:absolute; left:10px; width:100px; top:-26px; height:11px; background:rgba(43,43,43,.55); border-radius:6px; overflow:hidden; }
  .cuyG .hb i { display:block; height:100%; background:var(--verde-pasto); }
  .cuyG.flaco .hb i { background:var(--rojo); }
  .cuyG.muere .hb i { background:var(--rojo); animation:parpadea .5s infinite alternate; }
  .cuyG img { animation:respira 2.4s ease-in-out infinite; transform-origin:50% 100%; }
  .cuyG.come img { animation:come .25s 4; }
  @keyframes come { 50% { transform:translateY(-10px); } }
  @keyframes parpadea { to { opacity:.25; } }
  .cuy.flaco img, .cuyG.flaco img { filter:grayscale(.55) brightness(.88); }
  .cuy.flaco, .cuyG.flaco { --fy:.875; }
  .cuy.bebe, .cuyG.bebe { --b:.6; }
  .cuy.flaco::after, .cuyG.flaco::after { content:"🥺"; position:absolute; top:-20px; left:46px; font-size:30px; }
  .cuyG.flaco::after { top:-60px; }

  /* Corazón de pareja y pregunta (dentro de la granja) */
  #corazon { position:absolute; width:160px; height:160px; font-size:130px; line-height:160px; text-align:center; z-index:4; cursor:pointer; display:none; animation:late .8s ease-in-out infinite alternate; filter:drop-shadow(0 0 22px #F2E6C9); }
  #corazon::before { content:""; position:absolute; inset:-30px; }
  @keyframes late { to { transform:scale(1.18); } }
  #parejaModal { position:absolute; inset:0; z-index:6; display:none; background:rgba(43,43,43,.55); }
  #parejaModal.ver { display:block; }
  #parejaModal .caja { position:absolute; left:90px; right:90px; top:calc(var(--crop, 0px) + 520px); background:var(--crema); color:var(--negro); border-radius:48px; padding:40px; text-align:center; font-size:42px; font-weight:bold; }
  #parejaModal .fila2 { display:flex; gap:20px; margin-top:30px; }
  #parejaModal button { flex:1; font-size:38px; padding:22px; background:var(--verde-pasto); color:var(--crema); border-radius:36px; }
  #parejaModal #btnParejaNo { background:var(--tierra); }
  /* El territorio: mapa de lotes para comprar con monedas */
  #mapa { position:absolute; left:0; top:0; width:1080px; height:100%; z-index:3; display:none; overflow:hidden; background:linear-gradient(#B08F5F, #8D5F41); }
  #stage.mapa #mapa { display:block; }
  #stage.mapa .planta, #stage.mapa .barra, #stage.mapa .cuy, #stage.mapa #yapa, #stage.mapa #casita, #stage.mapa #abuela, #stage.mapa #burro, #stage.mapa #dialogo { display:none; }
  #mapaBotones { position:absolute; left:40px; right:40px; top:calc(var(--crop, 0px) + 205px); display:flex; gap:16px; align-items:center; z-index:2; }
  #mapaBotones button { font-size:38px; padding:18px 28px; border-radius:40px; }
  #mapaBotones .pill { margin-left:auto; font-size:34px; }
  #mapaVista { position:absolute; left:40px; width:1000px; top:calc(var(--crop, 0px) + 288px); height:744px; overflow:hidden; z-index:2; cursor:grab; }
  #mapaGrid { position:relative; width:1494px; height:744px; display:grid; grid-template-columns:repeat(10, 144px); gap:6px; background-size:100% 100%; }
  #mapaGrid.conFondo .lote { background:transparent !important; background-image:none !important; }
  .lote.lock { filter:saturate(.35) brightness(.7); }
  .lote.lock .cand { font-size:50px; line-height:1; } .lote.lock .cand img { width:50px; height:50px; }
  .lote.lock .lp { opacity:.75; }
  #mapaBotones button { padding:18px 22px; }
  .lote { position:relative; width:144px; height:144px; border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--crema); font-weight:bold; cursor:pointer; border:6px solid transparent; filter:saturate(.45) brightness(.78); }
  .lote .le { font-size:56px; line-height:1; } .lote .lp { font-size:26px; background:rgba(43,43,43,.55); padding:2px 12px; border-radius:20px; white-space:nowrap; }
  .lote.tV { background:var(--verde-pasto); } .lote.tL { background:#B3A24E; } .lote.tA { background:var(--morado); } .lote.tR { background:var(--azul); } .lote.tC { background:var(--verde-oscuro); }
  .lote.own, .lote.tC { filter:none; background-image:repeating-linear-gradient(90deg, rgba(43,43,43,.16) 0 6px, transparent 6px 22px); }
  .lote.vec { filter:saturate(.9) brightness(.95); border-color:var(--crema); animation:pulsa 1.2s ease-in-out infinite alternate; }
  .lote.sel { border-color:var(--maiz); box-shadow:0 0 0 6px rgba(201,180,88,.45); animation:none; filter:none; }
  @keyframes pulsa { to { border-color:rgba(242,230,201,.3); } }
  #mapaInfo { position:absolute; left:40px; right:40px; top:calc(var(--crop, 0px) + 1044px); z-index:2; background:rgba(43,43,43,.86); color:var(--crema); border-radius:36px; padding:16px 26px; display:flex; flex-direction:column; gap:10px; font-size:30px; }
  #mapaInfo .fila3 { display:flex; align-items:center; gap:20px; }
  #loteInfo { flex:1; line-height:1.25; } #loteInfo b { font-size:36px; display:block; }
  #btnComprar { font-size:34px; padding:20px 26px; border-radius:34px; background:var(--maiz); white-space:nowrap; }
  #precios { font-size:27px; opacity:.9; border-top:2px solid rgba(242,230,201,.25); padding-top:10px; line-height:1.35; }
  /* El recibo del mercado */
  #recibo { position:absolute; left:70px; right:70px; top:calc(var(--crop, 0px) + 330px); z-index:5; background:var(--crema); color:var(--negro); border-radius:44px; padding:30px 34px; display:none; font-size:36px; }
  #recibo h2 { font-size:48px; text-align:center; margin-bottom:14px; }
  #recibo .rf { display:flex; justify-content:space-between; gap:16px; padding:10px 0; border-bottom:2px dashed rgba(43,43,43,.25); }
  #recibo .rf span:nth-child(2) { opacity:.7; font-size:30px; }
  #recibo .rt { display:flex; justify-content:space-between; font-size:54px; font-weight:bold; margin-top:16px; }
  #recibo button { width:100%; margin-top:22px; font-size:38px; background:var(--verde-pasto); color:var(--crema); border-radius:36px; }
  #stage.dentro #mapa { display:none; }
  /* El camino: la abuelita camina a la derecha */
  #stage { touch-action:pan-y; }
  /* Panel plegable */
  #panelAgarre { display:flex; justify-content:center; margin:-14px 0 -4px; }
  #panelToggle { background:none; border:0; color:var(--crema); display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 80px; cursor:pointer; touch-action:none; }
  #panelToggle i { display:block; width:120px; height:10px; border-radius:6px; background:rgba(242,230,201,.55); }
  #panelFlecha { font-size:34px; line-height:1; transition:transform .3s; }
  #panel.plegado #panelFlecha { transform:rotate(180deg); }
  #panelCuerpo { display:flex; flex-direction:column; gap:12px; overflow:hidden; max-height:1400px; opacity:1; transition:max-height .35s ease, opacity .25s ease; }
  #panel.plegado #panelCuerpo { max-height:0; opacity:0; pointer-events:none; }
  #panel { transition:padding .35s ease; } #panel.plegado { padding-bottom:36px; }
  body.horizontal #panelToggle { padding:2px 60px; } body.horizontal #panelToggle i { width:70px; height:6px; } body.horizontal #panelFlecha { font-size:18px; }
  body.horizontal #panelCuerpo { gap:10px; }
  /* Portada, pausa y ajustes: pantalla completa, con tamaños normales */
  .gran { display:block; width:min(78vw,340px); margin:12px auto 0; font:bold 22px system-ui,sans-serif; padding:15px 24px; border:0; border-radius:40px; background:#C9B458; color:#2B2B2B; box-shadow:0 5px 0 #8f7d2c; cursor:pointer; }
  .gran:active { transform:translateY(3px); box-shadow:0 2px 0 #8f7d2c; }
  .gran.sec { background:#F2E6C9; box-shadow:0 5px 0 #b9ad8c; font-size:18px; padding:12px 24px; }
  #portada { position:fixed; inset:0; z-index:50; overflow:hidden; background:#2B2B2B; }
  #portada .pCielo { position:absolute; inset:0; background:linear-gradient(#7EC8F0,#D5ECF2 58%,#EAF2D8); }
  #portada img { position:absolute; display:block; pointer-events:none; user-select:none; }
  #portada .pMon { bottom:24%; left:50%; width:max(100%,820px); transform:translateX(-50%); }
  #portada .pMon2 { bottom:20%; left:50%; width:max(115%,940px); transform:translateX(-50%); }
  #portada .pSuelo { position:absolute; left:0; right:0; bottom:0; height:22%; background:#8A5A3C; border-top:10px solid #6B8F4E; }
  #portada .pCasa { bottom:16%; left:calc(50% - min(48vw,300px)); height:min(24vh,230px); }
  #portada .pAbuela { bottom:13%; left:50%; transform:translateX(-50%); height:min(40vh,400px); }
  #portada .pPlanta { height:min(30vh,300px); } #portada .p1 { bottom:15%; left:calc(50% + min(14vw,110px)); } #portada .p2 { bottom:15%; left:calc(50% + min(26vw,200px)); }
  #portada .pCentro { position:absolute; top:7%; left:0; right:0; text-align:center; }
  #portada h1 { margin:0; font:900 clamp(46px,13vw,96px) system-ui,sans-serif; color:#F2E6C9; text-shadow:0 5px 0 #2F4B3A, 0 0 28px rgba(0,0,0,.35); letter-spacing:1px; }
  #portada p { margin:4px 0 16px; font:700 clamp(17px,4.4vw,26px) system-ui,sans-serif; color:#F2E6C9; text-shadow:0 2px 0 #2F4B3A, 0 0 14px rgba(0,0,0,.45); }

<script>
let pausado = true;      // el juego arranca en pausa hasta pulsar "Jugar"
let habiaAvance = false; // se sabe al cargar la partida guardada
/* ===== CONFIGURACION: aquí cambias posiciones sin tocar el resto ===== */
const CONFIG = {

  poses: {

  // 8 espacios: los 4 primeros van adelante y los 4 últimos atrás (más pequeños y más altos)
  plantasX: [640, 750, 860, 970,  680, 790, 900, 1000],   // centro horizontal de cada planta

  hambre: { dura: 150, aviso: 0.35, gracia: 25, racion: 0.6, costo: 5 },

    cols: 10, filas: 5, centro: 22,   // 10 columnas x 5 filas = 50 lotes (el mapa se desliza hacia la derecha)
    mapa: ["AALAAARAAL", "LLVLAALVLA", "RV.VRLVLRA", "LVVLLARLVA", "ALRLAAALRA"],

/* ===== Escalar la escena a la pantalla ===== */
const stage = document.getElementById("stage");
const ALTO_MIN = 2200;   // alto mínimo de la escena: deja sitio al panel de mejoras sin tapar el campo
const ventana = document.getElementById("ventana"), panel = document.getElementById("panel"), viewport = document.getElementById("viewport");
function ajustar() {
  const W = innerWidth, H = innerHeight;
  const horizontal = W > H * 1.15;
  if (horizontal) {
    // Computador / celular acostado: se muestra solo la franja del campo (de y=440 a y=1740) y el panel va a la derecha
    const TOP = 440, ALTO_VISTA = 1300, ANCHO_PANEL = 404;
    const s = Math.min(H / ALTO_VISTA, (W - ANCHO_PANEL) / 1080);
    stage.style.height = ALTO_MIN + "px"; stage.style.setProperty("--alto", ALTO_MIN + "px"); stage.style.setProperty("--crop", TOP + "px");
    stage.style.transform = `translate(0px, ${-TOP * s}px) scale(${s})`;
    ventana.style.width = (1080 * s) + "px"; ventana.style.height = (ALTO_VISTA * s) + "px";
    document.body.classList.add("horizontal"); if (panel.parentNode !== viewport) viewport.appendChild(panel);
  } else {
    // Celular vertical: la escena crece hacia abajo si la pantalla es más larga que 9:16 (sin franjas oscuras)
    const s = Math.min(W / 1080, H / ALTO_MIN);
    const alto = Math.max(ALTO_MIN, Math.ceil(H / s) + 4);
    stage.style.height = alto + "px"; stage.style.setProperty("--alto", alto + "px"); stage.style.setProperty("--crop", "0px");
    stage.style.transform = `scale(${s})`;
    ventana.style.width = (1080 * s) + "px"; ventana.style.height = (alto * s) + "px";
    document.body.classList.remove("horizontal"); if (panel.parentNode !== stage) stage.appendChild(panel);
  }
}
addEventListener("resize", ajustar); ajustar();

const abuela = document.getElementById("abuela");

    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + d);

}

/* ===== Música de fondo (original, generada con código; sin archivos ni derechos de autor de terceros) =====
   Escala pentatónica menor de La (la favorita de los Andes). La melodía la compuse desde cero:
   no copia ninguna canción. Para cambiarla, edita FRASES y ACORDES. */
const ESC = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];   // La Do Re Mi Sol La Do Re Mi
const FRASES = {   // 16 pasos (corcheas) = 2 compases. número = nota de ESC, -2 = sigue sonando, -1 = silencio
  A:  [5,-2,6,-2,5,4,3,-2,  4,-2,3,-2,1,-2,0,-2],
  B:  [3,-2,4,-2,5,-2,7,-2,  6,-2,5,4,3,-2,-1,-1],
  C:  [7,-2,6,5,6,-2,5,-2,  4,3,4,-2,3,-2,1,-2],
  A2: [5,-2,6,-2,5,4,3,-2,  4,3,1,-2,0,-2,-2,-1],

const FORMA = ["A","B","A","A2","C","B","C","A2"];
const ACORDES = { Am: [220, 261.63, 329.63], C: [261.63, 329.63, 392], G: [196, 293.66, 392] };
const ARMONIA = { A: ["Am","C"], B: ["Am","G"], C: ["C","Am"], A2: ["Am","Am"] };
const ARPEGIO = [0,2,1,2,0,2,1,2];
let mg = null, tempMus = null, pasoMus = 0, tMus = 0;
function audio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); return ac; }
function flauta(f, t0, d) {
  const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "sine"; o.frequency.value = f; lfo.frequency.value = 5.2; lg.gain.value = f * 0.006;
  lfo.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.05, t0 + 0.06);
  g.gain.setValueAtTime(0.05, t0 + Math.max(0.07, d - 0.12)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(mg); o.start(t0); lfo.start(t0); o.stop(t0 + d + 0.02); lfo.stop(t0 + d + 0.02);
}
function charango(f, t0) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0.035, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  o.connect(g); g.connect(mg); o.start(t0); o.stop(t0 + 0.24);
}
function bombo(t0) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(110, t0); o.frequency.exponentialRampToValueAtTime(45, t0 + 0.18);
  g.gain.setValueAtTime(0.11, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(g); g.connect(mg); o.start(t0); o.stop(t0 + 0.28);
}
function bajo(f, t0) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.value = f / 2;
  g.gain.setValueAtTime(0.05, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
  o.connect(g); g.connect(mg); o.start(t0); o.stop(t0 + 0.52);
}
function ruido(t0, d, vol, fc) {                  // golpecito de ruido filtrado: caja y sonaja
  const n = Math.max(1, Math.floor(ac.sampleRate * d)), b = ac.createBuffer(1, n, ac.sampleRate), a = b.getChannelData(0);
  for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = b; f.type = "bandpass"; f.frequency.value = fc; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  s.connect(f); f.connect(g); g.connect(mg); s.start(t0);
}
function bomboF(t0, vol) {                        // bombo legüero con fuerza ajustable
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "sine"; o.frequency.setValueAtTime(120, t0); o.frequency.exponentialRampToValueAtTime(42, t0 + 0.2);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.3);

}
function zampona(f, t0, d) {                      // zampoña: tubo grave con soplido
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(0.04, t0 + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(mg); o.start(t0); o.stop(t0 + d + 0.02); ruido(t0, 0.07, 0.03, f * 3);
}
function programarPaso(t0, dur) {
  const fr = FORMA[Math.floor(pasoMus / 16) % FORMA.length], paso = pasoMus % 16, compas = paso < 8 ? 0 : 1, p8 = paso % 8;
  const acorde = ACORDES[ARMONIA[fr][compas]];
  const n = FRASES[fr][paso];
  if (n >= 0) {                                    // cuánto dura la nota: hasta la siguiente nota nueva
    let k = 1; while (paso + k < 16 && FRASES[fr][paso + k] === -2) k++;
    flauta(ESC[n], t0, k * dur * 0.95);
  }
  charango(acorde[ARPEGIO[p8]] * 2, t0);
  if (stage.classList.contains("viaje")) {          // en el camino al mercado: marcha con bombo, caja, sonaja y zampoña
    if (p8 % 2 === 0) bomboF(t0, p8 % 4 === 0 ? 0.2 : 0.12);

    ruido(t0, 0.04, 0.022, 6000);
    if (n >= 0) { let k = 1; while (paso + k < 16 && FRASES[fr][paso + k] === -2) k++; zampona(ESC[n] / 2, t0, k * dur * 0.9); }
  }
  if (p8 === 0 || p8 === 4) { bombo(t0); if (p8 === 0) bajo(acorde[0], t0); }
  pasoMus++;
}
function ciclo() {
  if (!musica || !ac || document.visibilityState === "hidden") return;
  const dur = 60 / (stage.classList.contains("viaje") ? 104 : esDia ? 88 : 68) / 2;           // corchea: de día más alegre, al atardecer más lento
  if (tMus < ac.currentTime) tMus = ac.currentTime + 0.05;
  while (tMus < ac.currentTime + 0.4) { programarPaso(tMus, dur); tMus += dur; }
}
function iniciarMusica() {
  if (!musica || tempMus) return;
  try {
    audio(); if (ac.state === "suspended" && !pausado) ac.resume();
    if (!mg) { mg = ac.createGain(); mg.gain.value = 0.55; mg.connect(ac.destination); }
    tMus = ac.currentTime + 0.1; tempMus = setInterval(ciclo, 120);
  } catch (e) { /* sin audio: el juego sigue */ }
}
function pararMusica() { clearInterval(tempMus); tempMus = null; }
addEventListener("pointerdown", iniciarMusica);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { if (ac && ac.state === "running") ac.suspend(); }
  else if (ac && ac.state === "suspended" && !pausado) ac.resume();
});
document.getElementById("btnMusica").addEventListener("click", () => {

  });

function animarCuyes(dt) {
  cuyes.forEach(c => {
    let camina = false;

const HB = CONFIG.hambre;
function imagenCuy(c, camina) {
  if (c.h < HB.aviso && CONFIG.cuyFlaco) return CONFIG.cuyFlaco;

function hambreCuyes(dt) {

    if (c.h <= 0) {

        elMsg.textContent = t("cuyMurio"); decir(t("cuyMurio"), 6000);

let cmAtras = 0, cmX = 0, cmDir = 0, cmT = 0, cmActivo = false, cmUlt = 0, cmSaludo = false;
function cmDibujar() {

/* ===== Trueque con la vecina Rosa: cambias cosecha sin vender por cultivos que valen más ===== */
const TRQ = [ { da: ["maiz", 40], rec: ["papa", 15] }, { da: ["papa", 20], rec: ["quinua", 11] }, { da: ["quinua", 10], rec: ["habas", 6] } ];   // cada trato da ~+15% a +20% de valor
const TRQ_MAX = 3, TRQ_ESPERA = 180000;       // veces por trato y tiempo (ms) hasta que Rosa vuelve a tener
let trqUsos = [0, 0, 0], trqT0 = Date.now(), trAbierto = false;
const trqEstado = () => ({ u: trqUsos.slice(), t: trqT0 });
function trqCargar(o) { if (o && Array.isArray(o.u)) { trqUsos = TRQ.map((_, i) => Math.max(0, Math.min(TRQ_MAX, Math.floor(Number(o.u[i]) || 0)))); trqT0 = Number.isFinite(o.t) ? o.t : Date.now(); } }
const cultPorId = id => CULT.find(k => k.id === id);
function pintarTrueque() {
  if (Date.now() - trqT0 > TRQ_ESPERA) { trqUsos = [0, 0, 0]; trqT0 = Date.now(); }
  document.getElementById("trTitulo").textContent = t("trTitulo"); document.getElementById("trInfo").textContent = t("trInfo"); document.getElementById("trCerrar").textContent = t("trCerrar");
  const falta = Math.max(0, Math.ceil((TRQ_ESPERA - (Date.now() - trqT0)) / 1000));
  document.getElementById("trOfertas").innerHTML = TRQ.map((o, i) => {
    const a = cultPorId(o.da[0]), b = cultPorId(o.rec[0]), tiene = Math.floor(stock[a.id] / a.valor), agot = trqUsos[i] >= TRQ_MAX, ok = tiene >= o.da[1] && !agot;
    return `<div class="trOferta"><div class="tx">${a.emoji} ${o.da[1]} ➜ ${b.emoji} ${o.rec[1]}<small>${agot ? t("trAgotado", falta) : t("trTiene", a.emoji + " " + fmt(tiene)) + " · " + (TRQ_MAX - trqUsos[i]) + "/" + TRQ_MAX}</small></div><button data-i="${i}" ${ok ? "" : "disabled"}>${agot ? t("trAgot") : t("trCambiar")}</button></div>`;
  }).join("");
  document.querySelectorAll("#trOfertas button").forEach(bt => bt.addEventListener("click", () => hacerTrueque(+bt.dataset.i)));
}
function hacerTrueque(i) {
  const o = TRQ[i], a = cultPorId(o.da[0]), b = cultPorId(o.rec[0]);
  if (trqUsos[i] >= TRQ_MAX || stock[a.id] / a.valor < o.da[1]) { elMsg.textContent = t("trFalta"); return; }
  stock[a.id] -= o.da[1] * a.valor; stock[b.id] = (stock[b.id] || 0) + o.rec[1] * b.valor; trqUsos[i]++;
  elMsg.textContent = t("trHecho"); sfx.compra(); mostrar(); guardar(); pintarTrueque();

/* ===== Progreso fuera de línea (al volver o al reabrir el juego) ===== */
const OFFLINE_MAX = 2 * 3600;     // máximo 2 horas de ausencia cuentan
const OFFLINE_EFIC = 0.5;         // lo cosechado fuera de línea vale la mitad
const SEG_POR_COSECHA = 4;        // cada cuy cosecha 1 planta cada 4 s
function aplicarFueraDeLinea(seg) {
  seg = Math.min(OFFLINE_MAX, seg);
  if (!(seg > 5)) return "";
  let cupo = Math.floor(adultos() * seg / SEG_POR_COSECHA), ganado = 0; const por = {};
  for (let i = 0; i < abiertas; i++) {
    const total2 = prog[i] + seg * velocidad() / CULT[cult[i]].seg, ciclos = Math.floor(total2), toma = Math.min(ciclos, cupo);
    cupo -= toma; por[CULT[cult[i]].id] = (por[CULT[cult[i]].id] || 0) + toma * CULT[cult[i]].valor * mult(cult[i]);
    prog[i] = toma < ciclos ? 1 : total2 - ciclos;               // sin cuy que la coseche, queda lista
  }
  Object.entries(por).forEach(([id, v]) => { const g = Math.floor(v * OFFLINE_EFIC); ganado += g; ganar(g, id); });
  if (ganado > 0) return t("fuera", fmt(ganado));
  return seg > 60 ? t("fueraPlantas") : "";
}
let msgFuera = "";

/* ===== Guardado del avance (en el celular, con localStorage) ===== */
const CLAVE = "chagrita_avance_v1";
function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify({
      v: 1, trq: trqEstado(), puntos, nivelAbono, abiertas, cuyes: cuyes.length, esDia, total, run, vendidos, semillas, sembrar, sonido, musica, idioma, hambres: cuyes.map(c => [+c.h.toFixed(3), +c.g.toFixed(1), +c.edad.toFixed(3)]), enfria: +enfriaPareja.toFixed(1),
      monedas, ventas, stock, precioVar, precioAnt, lotes: [...lotes], lotesCols: TER.cols,
      cult: cult.slice(), prog: prog.map(p => +p.toFixed(4)),
      t: Date.now(),
    }));
  } catch (e) { /* sin almacenamiento (modo privado, etc.): el juego sigue sin guardar */ }
}
function cargar() {
  let d;
  try { d = JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { return false; }
  if (!d || d.v !== 1) return false;
  const num = (x, min, max, def) => Number.isFinite(x) ? Math.min(max, Math.max(min, x)) : def;   // tolera datos dañados
  trqCargar(d.trq);
  puntos = num(d.puntos, 0, 1e15, 0); total = num(d.total, 0, 1e15, 0); run = num(d.run, 0, 1e15, 0); vendidos = Math.min(Math.floor(num(d.vendidos, 0, 1e9, 0)), Math.floor(run / CONFIG.sacos.capacidad));
  semillas = Math.floor(num(d.semillas, 0, 1e6, 0)); sembrar = Math.floor(num(d.sembrar, 0, CULT.length - 1, 0));
  sonido = d.sonido !== false; musica = d.musica !== false; if (d.idioma === "es" || d.idioma === "en") idioma = d.idioma;
  nivelAbono = Math.floor(num(d.nivelAbono, 0, 1000, 0));
  // las partidas guardadas antes de las parcelas tenían 4 plantas abiertas: se respetan
  const abiertasOld = d.abiertas === undefined ? Math.max(CONFIG.inicial, 4) : d.abiertas;
  abiertas = Math.floor(num(abiertasOld, CONFIG.inicial, CONFIG.plantasX.length, CONFIG.inicial));
  if (d.total === undefined) total = Math.max(run, puntos);    // partidas anteriores a los capítulos
  divs.forEach((dv, i) => dv.classList.toggle("bloqueada", i >= abiertas));
  if (Array.isArray(d.prog)) prog.forEach((_, i) => { prog[i] = num(d.prog[i], 0, 1, prog[i]); });
  if (Array.isArray(d.cult)) cult.forEach((_, i) => { cult[i] = Math.floor(num(d.cult[i], 0, CULT.length - 1, 0)); });
  const nc = Math.floor(num(d.cuyes, 0, CONFIG.granjaX.length, 0));
  while (cuyes.length < nc) crearCuy();
  if (Array.isArray(d.hambres)) cuyes.forEach((c, i) => { const h = d.hambres[i] || []; c.h = num(h[0], 0, 1, 1); c.g = num(h[1], 0, CONFIG.hambre.gracia, 0); c.avisado = c.h < CONFIG.hambre.aviso; c.edad = num(h[2], 0, 1, 1); });
  enfriaPareja = num(d.enfria, 0, 3600, 0);
  monedas = num(d.monedas, 0, 1e15, 0); ventas = Math.floor(num(d.ventas, 0, 1e9, 0));
  CULT.forEach(k => {
    stock[k.id] = d.stock ? num(d.stock[k.id], 0, 1e15, 0) : (k.id === "maiz" ? Math.max(0, run - vendidos * CONFIG.sacos.capacidad) : 0);   // partidas anteriores: todo era maíz
    if (d.precioVar) { precioVar[k.id] = num(d.precioVar[k.id], 0.7, 1.4, 1); precioAnt[k.id] = d.precioAnt ? num(d.precioAnt[k.id], 0.7, 1.4, 1) : precioVar[k.id]; }
  });
  if (Array.isArray(d.lotes)) {
    const oc = d.lotesCols || 5;     // el mapa antes tenía 5 columnas: se pasan los lotes a su misma posición en el mapa ancho
    d.lotes.forEach(i => { if (!Number.isInteger(i) || i < 0) return; const j = Math.floor(i / oc) * TER.cols + (i % oc); if (j < TER.cols * TER.filas && i % oc < TER.cols) lotes.add(j); });
  }
  aplicarLuz(d.esDia !== false);
  msgFuera = aplicarFueraDeLinea((Date.now() - num(d.t, 0, Date.now(), Date.now())) / 1000);
  return true;
}

const esperar = ms => new Promise(r => setTimeout(r, ms));
async function irAlMercado() {
  if (enTransicion) return;

  if (n < 1) { elMsg.textContent = t("burroVacio"); return; }
  enTransicion = true; teclas.izq = teclas.der = false; objetivo = null; imgAbuela.classList.remove("camina");
  elDialogo.classList.remove("ver");

    burroViaje.style.transition = "left 3.6s linear"; burroViaje.style.left = "1100px"; await esperar(3700);

    burroViaje.style.transition = "none"; burroViaje.style.left = "-450px"; void burroViaje.offsetWidth;
    fade.style.opacity = 0; await esperar(400);
    burroViaje.style.transition = "left 2.2s ease-out"; burroViaje.style.left = "330px"; await esperar(2300);
    imgBurroViaje.classList.remove("camina"); await esperar(400);
    // 3. vende: recibo con cantidad × precio de cada cultivo
    imgBurroViaje.src = CONFIG.ruta + MER.burros[0]; sfx.yapa();
    const m = document.createElement("div"); m.className = "mas"; m.textContent = "+" + fmt(venta.total) + " 💰";
    m.style.left = "400px"; m.style.top = "980px"; m.style.fontSize = "84px"; stage.appendChild(m); setTimeout(() => m.remove(), 1000);
    elMsg.textContent = t("vendido", n, fmt(venta.total)); mostrar();

burro.addEventListener("pointerdown", irAlMercado);
// Vender n sacos: cada cultivo aporta su parte de los sacos (en proporción a lo que cosechaste) y se paga a su precio del día
function venderSacos(n) {
  const S = n * SAC.capacidad, tot = CULT.reduce((a, k) => a + stock[k.id], 0) || 1, parte = Math.min(1, S / tot);
  const filas = CULT.map(k => {
    const val = stock[k.id] * parte, unidades = val / k.valor, precio = precioHoy(k);
    return { k, val, unidades, precio, monto: Math.round(unidades * precio) };
  }).filter(f => f.unidades >= 0.5);
  filas.forEach(f => { stock[f.k.id] = Math.max(0, stock[f.k.id] - f.val); });
  const total = filas.reduce((a, f) => a + f.monto, 0);
  vendidos += n; monedas += total; ventas++; guardar();
  return { filas, total, n };
}
function mostrarRecibo(v) {
  const el = document.getElementById("recibo");
  el.innerHTML = `<h2>${t("reciboT")}</h2>` + v.filas.map(f => `<div class="rf"><span>${f.k.emoji} ${t("cultivo")[f.k.id]}</span><span>${t("reciboPrecio", fmt(Math.round(f.unidades)), num1(f.precio))}</span><span>${fmt(f.monto)} 💰</span></div>`).join("") +
    `<div class="rt"><span>${t("reciboTotal")}</span><span>${fmt(v.total)} 💰</span></div><button id="btnReciboOk">${t("reciboOk")}</button>`;
  el.style.display = "block";
  return new Promise(res => { const fin = () => { el.style.display = "none"; res(); }; document.getElementById("btnReciboOk").addEventListener("click", fin); setTimeout(fin, 20000); });
}

/* ===== Caminar, la puerta y el saco ===== */
const C = CONFIG.caminar;
const fade = document.getElementById("fade");
let abX = C.inicio, objetivo = null, dentro = false, enTransicion = false, puertaLibre = true, avisoSaco = false;
const teclas = { izq: false, der: false };

const SAC = CONFIG.sacos;
const sacosEl = SAC.huecos.map(h => {
  const d = document.createElement("div"); d.className = "en-suelo saco" + (h.atras ? " atras" : "");
  d.style.left = (h.x - 150) + "px"; d.style.display = "none"; d.innerHTML = '<img alt="">';
  document.getElementById("sacos").appendChild(d); return d;
});
const nivelDe = frac => { let n = 0; SAC.cortes.forEach((c, i) => { if (frac >= c) n = i; }); return n; };
const sacosHechos = () => Math.floor(run / SAC.capacidad);
const sacosLlenos = () => Math.max(0, sacosHechos() - vendidos);   // los sacos vendidos ya no están
function actualizarSaco() {
  const llenos = sacosLlenos(), visibles = Math.min(sacosEl.length, llenos + 1);   // cuando uno se llena, aparece otro vacío
  sacosEl.forEach((d, i) => {
    d.style.display = i < visibles ? "" : "none";
    if (i >= visibles) return;
    const frac = i < llenos ? 1 : (run - sacosHechos() * SAC.capacidad) / SAC.capacidad;
    const arch = SAC.archivos[nivelDe(frac)], img = d.firstChild;
    if (!img.src.endsWith(arch)) img.src = CONFIG.ruta + arch;
  });
  actualizarBurro();
}
function colocarAbuela() {
  abuela.style.left = (abX - 140) + "px";
  // el globo de diálogo sigue a la abuelita
  const L = Math.max(20, Math.min(420, abX - 230));
  elDialogo.style.left = L + "px";
  elDialogo.style.setProperty("--cola", Math.max(30, Math.min(560, abX - L - 26)) + "px");
}
function cruzarPuerta(haciaDentro) {
  enTransicion = true; teclas.izq = teclas.der = false; objetivo = null;
  tono(196, .12, "triangle", .07); tono(147, .16, "triangle", .07, .1);
  fade.style.opacity = 1;
  setTimeout(() => {
    dentro = haciaDentro; stage.classList.toggle("dentro", dentro);
    abX = C.salida; puertaLibre = false; avisoSaco = false;
    actualizarSaco(); colocarAbuela(); imgAbuela.classList.remove("camina");
    fade.style.opacity = 0;
    setTimeout(() => { enTransicion = false; }, 350);
  }, 380);
}
function moverAbuela(dt) {
  if (enTransicion || vistaActual()) return;
  let dir = 0;
  if (teclas.izq || teclas.der) { dir = (teclas.der ? 1 : 0) - (teclas.izq ? 1 : 0); objetivo = null; }
  else if (objetivo !== null) {
    const d = objetivo - abX;
    if (Math.abs(d) <= C.vel * dt) { abX = objetivo; objetivo = null; } else dir = Math.sign(d);
  }
  if (dir) abX += dir * C.vel * dt;
  abX = Math.max(C.minX, Math.min(C.maxX, abX));
  imgAbuela.classList.toggle("camina", dir !== 0);
  colocarAbuela();
  if (!puertaLibre && abX > 300) puertaLibre = true;          // para no volver a cruzar la puerta sin querer
  const puerta = dentro ? C.puertaDentro : C.puertaFuera;
  if (puertaLibre && abX <= puerta + 20) { cruzarPuerta(!dentro); return; }
  if (dentro && !avisoSaco && Math.abs(abX - C.saco) < 110) {  // llegó al saco
    avisoSaco = true; decir(t("saco", fmt(Math.floor(run)), sacosLlenos()), 4500); pose("contenta", 900); sfx.compra();
  }
}
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") { teclas.izq = true; e.preventDefault(); }
  if (k === "arrowright" || k === "d") { teclas.der = true; e.preventDefault(); }
});
addEventListener("keyup", e => {
  puertaLibre = true;                       // al soltar la tecla ya puede volver a cruzar la puerta
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") teclas.izq = false;
  if (k === "arrowright" || k === "d") teclas.der = false;
});
addEventListener("blur", () => { teclas.izq = teclas.der = false; });
// Con el dedo o el mouse: tocar o arrastrar en el campo y la abuelita camina hacia ese punto (sin botones en pantalla)
let arrastrando = false;
function xEscena(e) { const r = stage.getBoundingClientRect(); return (e.clientX - r.left) * 1080 / r.width; }
stage.addEventListener("pointerdown", e => {
  if (vistaActual() || e.target.closest(".planta, .cuy, #panel, button, #yapa, #burro")) return;
  arrastrando = true; objetivo = xEscena(e); puertaLibre = true;
});
stage.addEventListener("pointermove", e => { if (arrastrando) objetivo = xEscena(e); });
addEventListener("pointerup", () => { arrastrando = false; });
addEventListener("pointercancel", () => { arrastrando = false; });
colocarAbuela();

/* ===== Menús: portada, pausa, ajustes y panel plegable ===== */
const $ = id => document.getElementById(id);
const velo = id => $(id).classList;
function pausar(v, mudo = true) {                 // v = true: congela el juego (mudo = también silencia el audio)
  pausado = v; ultimo = performance.now(); cmUlt = performance.now();
  if (mudo && ac) { if (v && ac.state === "running") ac.suspend(); else if (!v && ac.state === "suspended") ac.resume(); }
}
let msgInicial = "", primeraVez = true;
function jugar() {
  $("portada").style.display = "none"; pausar(false); iniciarMusica();
  if (msgInicial) { elMsg.textContent = msgInicial; msgInicial = ""; }
  if (primeraVez && !habiaAvance) setTimeout(() => decir(t("dialogos")[0], 7000), 800);
  primeraVez = false; mostrar();
}
function irAlInicio() { guardar(); velo("pausa").remove("ver"); $("portada").style.display = ""; pausar(true, false); mostrar(); }
let pausadoAntes = false;
function abrirAjustes() { pausadoAntes = pausado; pausado = true; velo("ajustes").add("ver"); }
function cerrarAjustes() { velo("ajustes").remove("ver"); if (!pausadoAntes) { pausado = false; ultimo = performance.now(); cmUlt = performance.now(); } }
$("pJugar").addEventListener("click", jugar);
$("pAjustes").addEventListener("click", abrirAjustes); $("paAjustes").addEventListener("click", abrirAjustes); $("btnAjustes").addEventListener("click", abrirAjustes);
$("ajCerrar").addEventListener("click", cerrarAjustes);
$("btnPausa").addEventListener("click", () => { if (pausado || stage.classList.contains("viaje")) return; pausar(true); velo("pausa").add("ver"); });
$("paContinuar").addEventListener("click", () => { velo("pausa").remove("ver"); pausar(false); });
$("paInicio").addEventListener("click", irAlInicio);
addEventListener("keydown", e => {
  if (e.key !== "Escape" || cmActivo) return;
  if (velo("ajustes").contains("ver")) cerrarAjustes();
  else if (velo("pausa").contains("ver")) { velo("pausa").remove("ver"); pausar(false); }
  else if ($("portada").style.display !== "none") return;
  else if (!pausado && !stage.classList.contains("viaje") && !vistaActual()) { pausar(true); velo("pausa").add("ver"); }
});
// Panel plegable: toca la manija, o desliza hacia abajo para plegar y hacia arriba para desplegar
const elPanel = $("panel");
function plegarPanel(v) {
  elPanel.classList.toggle("plegado", v); $("panelToggle").setAttribute("aria-expanded", String(!v));
  try { localStorage.setItem("chagrita_panel", v ? "1" : "0"); } catch (e) {}
}
let pgY = null;
$("panelToggle").addEventListener("pointerdown", e => { pgY = e.clientY; });
addEventListener("pointerup", e => {
  if (pgY === null) return; const dy = e.clientY - pgY; pgY = null;
  if (dy > 28) plegarPanel(true); else if (dy < -28) plegarPanel(false); else plegarPanel(!elPanel.classList.contains("plegado"));
});
try { if (localStorage.getItem("chagrita_panel") === "1") plegarPanel(true); } catch (e) {}

/* ===== Avisos de arriba: aparecen y se van solos ===== */
let timerMsg; const elMsgV = document.getElementById("msg");
new MutationObserver(() => {
  if (!elMsgV.textContent.trim()) return;
  elMsgV.classList.add("ver"); clearTimeout(timerMsg); timerMsg = setTimeout(() => elMsgV.classList.remove("ver"), 4500);
}).observe(elMsgV, { childList: true, characterData: true, subtree: true });
document.getElementById("capTxt").addEventListener("click", () => verNombreCap());

/* ===== Arranque (al final, cuando todo ya existe) ===== */
habiaAvance = cargar();
revisarCapitulo(false); mostrar();
requestAnimationFrame(bucle); programarYapa();
msgInicial = msgFuera || (habiaAvance ? t("espera") : t("inicio", fmt(puntos)));
mostrar();
</script>
